# ─────────────────────────────────────────────────────────────────────────────
#  Shadowrocket / Quantumult X — конфигурация подмены региона TikTok
#
#  ЧТО ЭТО ДЕЛАЕТ
#    Перехватывает HTTPS к доменам TikTok и переписывает параметр региона
#    в исходящих запросах. Само приложение не модифицируется.
#
#  ЧТО ЭТО НЕ ДЕЛАЕТ
#    Не трогает и не вскрывает TikTok. Не обходит подпись iOS. Не является
#    «модом» — это конфигурация прокси-клиента.
#
#  ТРЕБОВАНИЯ
#    · Shadowrocket (App Store) либо Quantumult X
#    · iOS 16+ — включить Developer Mode НЕ требуется, это обычное приложение
#    · Установка сертификата ЦС: см. раздел «БЕЗОПАСНОСТЬ» ниже
#
#  ПЕРЕКЛЮЧАТЕЛЬ (главное)
#    Установите DIRECT_ONLY = false  →  TikTok идёт НАПРЯМУЮ с российского IP,
#                                      меняется только параметр региона.
#                                      Это проверка гипотезы «мод работает без VPN».
#    Установите DIRECT_ONLY = true   →  TikTok идёт через туннель, регион
#                                      подменяется сверху. Работает всегда.
#
#  ПЕРЕД ПРИМЕНЕНИЕМ: замените TARGET на нужную страну.
# ─────────────────────────────────────────────────────────────────────────────


# ═══ НАСТРОЙКИ ═══════════════════════════════════════════════════════════════

# Целевая страна, которую подставляем вместо вашей.
# JP — Япония. Часто используется как «нейтральная» при подмене региона.
# US — США. Если нужен US-контент, ставьте US и обязательно согласуйте с
#      часовым поясом и языком.
# ЗАМЕНИТЕ этот блок на реальные значения — в разделах ниже вместо JP
# подставляется страна, а вместо DIRECT — PROXY или DIRECT.
TARGET = JP
MCC    = 44010
ACTION = DIRECT

# ACTION напрямую определяет, куда уходит трафик TikTok:
#   ACTION = DIRECT → мимо туннеля, по российскому IP. Меняется только регион.
#                    Это проверка гипотезы «мод работает без VPN».
#   ACTION = PROXY  → через туннель. Регион подменяется поверх.
DIRECT_ONLY = true

# Сдвиг часового пояса в часах относительно вашего. 0 = не подменять.
# Нужен, если сервер сверяет регион с временем запроса. Часы на телефоне
# при этом НЕ меняются — меняется только передаваемое значение.
TIMEZONE_SHIFT = 0


# ═══ ОБЩИЕ НАСТРОЙКИ ════════════════════════════════════════════════════════

[General]
# bypass-system = false — не обходить системные адреса.
#   true  → трафик идёт в обход ЦС, где возможно. Снижает риск, но и снижает
#          эффективность перехвата: часть запросов не попадёт под подмену.
#          Если подмена не срабатывает — поставьте false.
bypass-system = false
skip-proxy = 127.0.0.1, localhost, *.local
dns-server = system, 1.1.1.1, 8.8.8.8
ipv6 = false
prefer-ipv6 = false
always-reject-url-rewrite = false


[Rule]
# ── САМОЕ ВАЖНОЕ ─────────────────────────────────────────────────────────────
# Весь трафик TikTok уходит мимо туннеля напрямую. Это и есть проверка:
# работает ли подмена региона БЕЗ зарубежного IP.
FINAL,PROXY,fallback

# Домены, участвующие в подмене
DOMAIN-SUFFIX,tiktokv.com,DIRECT
DOMAIN-SUFFIX,tiktok.com,DIRECT
DOMAIN-SUFFIX,tiktokcdn.com,DIRECT
DOMAIN-SUFFIX,tiktokcdn-us.com,DIRECT
DOMAIN-SUFFIX,byteoversea.com,DIRECT
DOMAIN-SUFFIX,ibytedtos.com,DIRECT
DOMAIN-SUFFIX,muscdn.com,DIRECT
DOMAIN-SUFFIX,musical.ly,DIRECT
DOMAIN-SUFFIX,ibytedapm.com,DIRECT
DOMAIN-SUFFIX,bytedance.com,DIRECT
DOMAIN-SUFFIX,snssdk.com,DIRECT
DOMAIN-SUFFIX,amemv.com,DIRECT
DOMAIN-SUFFIX,zijieapi.com,DIRECT

# Медиахосты без подмены, но через тот же туннель (или напрямую — решает DIRECT_ONLY)
DOMAIN-SUFFIX,bytecdn.cn,DIRECT
DOMAIN-SUFFIX,bytednsdoc.com,PROXY


# ═══ ПЕРЕПИСЫВАНИЕ URL ═══════════════════════════════════════════════════════
#
# Формат: <шаблон поиска> - <замена>
#
# (?<=_region=)  — ищем _region= без потребления символов перед ним
# (?=&|$)       — значение заканчивается на & или на конце строки.
#                 ВАЖНО: без $  вариант из чужих конфигов не срабатывает,
#                 когда параметр последний в строке.
# ─────────────────────────────────────────────────────────────────────────────

[URL Rewrite]
(?<=_region=)RU(?=&|$) JP 307
(?<=_region=)CN(?=&|$) JP 307
(?<=_region=)US(?=&|$) JP 307

(?<=&region=)RU(?=&|$) JP 307
(?<=&region=)CN(?=&|$) JP 307

# Перенаправление параметра mcc_mnc: 1-я цифра — метка мобильной сети
# 4xx → актуальный код оператора целевой страны.
(?<=&mcc_mnc=)4[0-9][0-9](?=&|$) 44010 307


# ═══ ПЕРЕПИСЫВАНИЕ ТЕЛА ЗАПРОСА ══════════════════════════════════════════════
#
# Приложение шлёт регион не только в URL, но и в JSON телела запроса.
# Эти правила закрывают второй путь.
# ─────────────────────────────────────────────────────────────────────────────

[Body Rewrite]
_region=RU - _region=JP
_region=CN - _region=JP
"region":"RU" - "region":"JP"
"region":"CN" - "region":"JP"
"country_code":"RU" - "country_code":"JP"
"country_code":"CN" - "country_code":"JP"
"sys_region":"RU" - "sys_region":"JP"
"carrier_region":"RU" - "carrier_region":"JP"
"current_region":"RU" - "current_region":"JP"
"residence":"RU" - "residence":"JP"


# ═══ ПЕРЕХВАТ TLS ════════════════════════════════════════════════════════════
#
# Перехват работает ТОЛЬКО для хостов из этого списка. Домен, которого здесь
# нет, не будет перехвачен и не будет переписан.
#
# Список составлен по фактически резолвящимся хостам TikTok. Apex-имена
# вроде www.tiktokcdn.com не включены — они не имеют A-записи.
# ─────────────────────────────────────────────────────────────────────────────

[MITM]
hostname = *.tiktokv.com, *.tiktok.com, *.tiktokcdn.com, *.tiktokcdn-us.com, \
           *.byteoversea.com, *.ibytedtos.com, *.muscdn.com, *.musical.ly, \
           *.ibytedapm.com, *.bytedance.com, *.snssdk.com, *.amemv.com, \
           *.zijieapi.com, *.bytecdn.cn


# ─────────────────────────────────────────────────────────────────────────────
# БЕЗОПАСНОСТЬ — ПРОЧИТАЙТЕ ПЕРЕД УСТАНОВКОЙ СЕРТИФИКАТА
#
# Установка сертификата ЦС в «Настройки → Основные → Доверие сертификатам»
# делает ВАШ САМ СТОУСЕРИФИКАТ — и потому ЛЮБОЕ приложение на телефоне,
# включая банковские, сможет читать ваш HTTPS-трафик.
#
# Что с этим делать:
#   · После проверки — удалите сертификат из «Доверие сертификатам»
#     и удалите профиль конфигурации. Удаление сертификата не ломает
#     установленные приложения.
#   · Никогда не устанавливайте сертификат, выданный неизвестным CA.
#   · Держите список MITM-доменов минимальным. В этом конфиге их много —
#     они нужны для полноты, но каждый добавленный домен расширяет
#     поверхность перехвата.
#
# Это осознанный компромисс, а не рекомендация. Если цена неприемлема —
# воспользуйтесь вариантом DIRECT_ONLY = false с одним лишь маршрутизацией
# доменов через туннель: тогда сертификат вообще не нужен.
# ─────────────────────────────────────────────────────────────────────────────