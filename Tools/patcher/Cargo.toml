[package]
name = "tiktok-region-installer"
version = "1.0.0"
edition = "2021"

# Лицензия: GPL-3.0, как и остальной проект. Зависимость insert-dylib
# распространяется под MIT — она совместима с GPL-3.0.
license = "GPL-3.0-only"

[[bin]]
name = "tiktok-region-installer"
path = "src/main.rs"

[dependencies]
# Зависимостей нет намеренно. Всю работу с архивом делает zsign,
# который лежит рядом готовым бинарником. Своя реализация ZIP здесь
# была бы лишним кодом, который ещё и придётся поддерживать.
# Ноль зависимостей — это и есть ответ на вопрос «куда уходят данные»:
# программа не может никуда отправить то, чего в ней нет.

[profile.release]
opt-level = "z"
lto = true
strip = true
