name: Сборка TikTokRegion.dylib (arm64)

# Зачем этот файл
# ----------------
# Собрать iOS-библиотеку на Windows нельзя: нужен Apple ObjC-рантайм,
# Foundation и iOS SDK, которые поставляются только с Xcode на macOS.
#
# Это НЕ обход ограничения. Это единственный способ получить настоящую
# сборку без Mac. GitHub Actions даёт бесплатные macOS-раннеры для
# публичных репозиториев.
#
# Почему clang, а не theos
# -----------------------
# theos — это сборщик пакетов: он нужен, чтобы завернуть результат в
# .deb с зависимостями и полями для Cydia. Здесь это лишнее: для
# подмены требуется голый .dylib, который потом вставляется в IPA
# через insert_dylib. Сборка напрямую clang короче, быстрее и не
# зависит от того, какие make-файлы Theos подключает при заданных
# переменных. Проблем с целевой целью package уже не возникает.
#
# Что здесь происходит
# --------------------
#   1. C-логика: clang -Werror + 47 тестов ДО сборки
#   2. ObjC-мост: тот же файл компилируется под настоящий iOS SDK
#   3. lipo: проверка, что бинарник действительно arm64
#   4. otool: проверка зависимостей и install_name
#   5. Готовый dylib отдаётся артефактом
#
# Что это НЕ делает
# -----------------
# Не подписывает и не внедряет. Подпись и внедрение идут на устройстве:
# ключа для подписи в репозитории быть не должно.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Tweak/**'
      - '.github/workflows/build-tweak.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Забрать исходники
        uses: actions/checkout@v4

      - name: Показать окружение
        run: |
          sw_vers
          xcodebuild -version
          echo "iphoneos SDK: $(xcrun --sdk iphoneos --show-sdk-version)"

      - name: C-логика — компиляция и 47 тестов
        # Самый важный шаг. RegionLogic.h — тот самый код, что попадёт
        # в dylib. Если тесты падают, дальше идти незачем.
        run: |
          set -euo pipefail
          clang -std=c99 -Wall -Wextra -Werror \
                -o /tmp/rl_test Tools/test-region-logic.c
          /tmp/rl_test

      - name: Проверить, что ObjC-мост берёт логику из C, а не дублирует её
        # Ключевая идея проекта: ObjC не содержит собственной логики
        # подмены. Если это перестанет быть так, тесты выше перестанут
        # проверять то, что реально уедет в dylib.
        run: |
          set -euo pipefail
          grep -q 'rl_rewrite_params' Tweak/TikTokRegion.m || {
            echo "::error::ObjC-мост не вызывает C-логику"; exit 1; }
          echo "мост использует rl_rewrite_params из RegionLogic.h"

      - name: Собрать dylib под iOS arm64
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p out

          # arm64, потому что подменяется App Store IPA, а он arm64
          # даже на arm64e-устройствах (A14+). Для джейлбрейк-пути
          # нужен arm64e — эти архитектуры нельзя смешивать.
          clang \
            -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=15.0 \
            -fobjc-arc \
            -Wall -Wextra \
            -O2 \
            -dynamiclib \
            -framework Foundation \
            -framework Security \
            -framework UIKit \
            -install_name "@executable_path/TikTokRegion.dylib" \
            -o out/TikTokRegion.dylib \
            Tweak/TikTokRegion.m

          test -f out/TikTokRegion.dylib || {
            echo "::error::dylib не создан"; exit 1; }

      - name: Проверить бинарник
        run: |
          set -euo pipefail
          DYLIB=out/TikTokRegion.dylib
          file "$DYLIB"
          lipo -info "$DYLIB"
          lipo -info "$DYLIB" | grep -q 'arm64' || {
            echo "::error::ожидалась архитектура arm64"; exit 1; }

          echo
          echo "install_name:"
          otool -D "$DYLIB"
          echo
          echo "зависимости (должны быть только системные):"
          otool -L "$DYLIB"
          echo
          echo "проверка на неожиданные зависимости:"
          if otool -L "$DYLIB" | grep -Ei '/Users/|/opt/|@rpath' ; then
            echo "::error::dylib тянет что-то извне iOS"
            exit 1
          fi
          echo "внешних зависимостей нет"

          echo
          echo "символы, которые ищет приложение:"
          nm -gU "$DYLIB" | grep -i constructor || echo "(конструктор не найден — проверь вручную)"

      - name: Отдать dylib
        uses: actions/upload-artifact@v4
        with:
          name: TikTokRegion-dylib-arm64
          path: out/TikTokRegion.dylib
          retention-days: 90
          if-no-files-found: error

      - name: Итог
        run: |
          {
            echo "### Dylib собран"
            echo
            echo "Артефакт **TikTokRegion-dylib-arm64** — в разделе **Artifacts**"
            echo "внизу страницы запуска."
            echo
            echo "Что дальше делать на устройстве:"
            echo
            echo "1. Нужен **расшифрованный** \`TikTok.ipa\` — из App Store"
            echo "   файл зашифрован, и insert_dylib его не возьмёт."
            echo "2. Вставить библиотеку:"
            echo
            echo '```bash'
            echo "insert_dylib -i TikTok.ipa -d TikTokRegion.dylib -m insert_dylib \\"
            echo "             --target-version 16.0 --inplace"
            echo '```'
            echo
            echo "3. Переподписать Sideloadly или AltStore — оба работают"
            echo "   на Windows, подпись своим Apple ID."
            echo "4. Поставить на телефон по USB."
          } >> "$GITHUB_STEP_SUMMARY"
