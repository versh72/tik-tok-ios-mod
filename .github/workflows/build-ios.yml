name: Build unsigned IPA (no Mac needed)

# Why this exists
# ---------------
# Xcode only runs on macOS, so building this app on a Windows or Linux machine
# is impossible locally. GitHub Actions provides hosted macOS runners, which
# cost nothing for a public repository.
#
# This workflow produces an UNSIGNED device-arm64 .ipa. It deliberately does
# NOT sign the app: signing a free personal-team build in CI would require the
# Apple Account password as a repository secret, which is not something to put
# in a repo, public or otherwise.
#
# Signing happens locally on your own machine with Sideloadly (Windows, macOS
# or Linux, free), using your own Apple ID. The Apple ID never leaves your
# machine and never touches this repository.
#
# See CI-BUILD.md for the full walkthrough.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    # macOS runners are free in public repositories. In a private repository
    # they consume plan minutes at a 10x multiplier, so expect a charge.
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        # Generates TikTokNetDiag.xcodeproj from project.yml. The generated
        # project is never committed, so there is no merge conflict risk.
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Verify the pure-logic package builds and its tests pass
        # This is the check that matters most: NetDiagCore has no UI or
        # networking dependency, so the whole suite runs here without a
        # simulator.
        working-directory: NetDiag
        run: |
          swift build
          swift test

      - name: Build the iOS app (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project TikTokNetDiag.xcodeproj \
            -scheme TikTokNetDiag \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS=arm64 \
            build | xcpretty || exit 1

      - name: Confirm the binary is arm64 and unsigned
        run: |
          APP="build/Build/Products/Release-iphoneos/TikTokNetDiag.app"
          test -d "$APP" || { echo "::error::app bundle not found at $APP"; exit 1; }
          BIN="$APP/TikTokNetDiag"
          file "$BIN"
          lipo -info "$BIN"
          # A signed bundle would contain _CodeSignature/. Its absence here is
          # expected and is what Sideloadly will fill in.
          if [ -d "$APP/_CodeSignature" ]; then
            echo "::warning::bundle is already signed; Sideloadly will re-sign it"
          else
            echo "bundle is unsigned, as intended"
          fi

      - name: Package as .ipa
        run: |
          APP="build/Build/Products/Release-iphoneos/TikTokNetDiag.app"
          STAGE="$(mktemp -d)"
          mkdir -p "$STAGE/Payload"
          cp -R "$APP" "$STAGE/Payload/"
          cd "$STAGE"
          # -r so the symlinks inside the framework directory survive.
          zip -qry "$GITHUB_WORKSPACE/NetDiag-unsigned.ipa" Payload
          cd "$GITHUB_WORKSPACE"
          rm -rf "$STAGE"
          ls -lh NetDiag-unsigned.ipa

      - name: Upload the .ipa
        uses: actions/upload-artifact@v4
        with:
          name: NetDiag-unsigned-ipa
          path: NetDiag-unsigned.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Summary
        run: |
          {
            echo "### Build succeeded"
            echo
            echo "Download **NetDiag-unsigned-ipa** from the Artifacts section."
            echo
            echo "Install it with Sideloadly (free, runs on Windows):"
            echo "1. Install iTunes + iCloud (web/Apple versions, not the Microsoft Store ones)."
            echo "2. Connect the iPhone by USB and unlock it."
            echo "3. Sideloadly -> select the .ipa -> your Apple ID -> Start."
            echo "4. On the iPhone: Settings -> Privacy & Security -> Developer Mode -> on -> restart."
            echo
            echo "The free profile expires after 7 days. Re-run this workflow and reinstall."
          } >> "$GITHUB_STEP_SUMMARY"