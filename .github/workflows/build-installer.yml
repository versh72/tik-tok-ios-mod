name: Сборка установщика для Windows

# Зачем этот файл
# ----------------
# Пользователю не должно приходиться ставить Rust, insert_dylib и разбираться
# с командной строкой. Здесь собирается один .exe, который делает всю работу
# по вставке библиотеки в перепакованный IPA.
#
# Всё происходит на macOS-раннере, а отдаётся готовая программа под Windows.
# Пользователю нужен только этот файл и перепакованный IPA.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Tools/patcher/**'
      - '.github/workflows/build-installer.yml'

permissions:
  contents: read

jobs:
  build:
    # Сборка идёт на Windows-раннере, а не на macOS.
    #
    # Почему так: Rust собирает .exe линкером той же системы. Кросс-сборка
    # с macOS на Windows требует link.exe и полного набора Windows SDK,
    # которых на macOS-раннере нет: сборка падала с
    #   error: linker `link.exe` not found
    #
    # На windows-раннере всё это есть из коробки, а для публичного
    # репозитория он бесплатен.
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Забрать исходники
        uses: actions/checkout@v4

      # insert-dylib: вставка LC_LOAD_DYLIB в Mach-O. Написан на Rust,
      # работает на всех трёх платформах. Лицензия MIT — совместима с GPL-3.0.
      - name: Поставить Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Собрать insert-dylib под Windows
        run: |
          git clone --depth 1 https://github.com/hookforge/insert-dylib.git insert-dylib
          cd insert-dylib
          cargo build --release
          New-Item -ItemType Directory -Force -Path ..\out | Out-Null
          Copy-Item target\release\insert-dylib.exe ..\out\
          Get-ChildItem ..\out\insert-dylib.exe | Select-Object Name, Length

      - name: Собрать обёртку установщика
        # Небольшая программа, которая делает всю работу за пользователя:
        # проверяет шифрование, распаковывает IPA, вставляет библиотеку,
        # кладёт её внутрь и собирает обратно.
        run: |
          New-Item -ItemType Directory -Force -Path out\patcher\src | Out-Null
          Copy-Item Tools\patcher\Cargo.toml out\patcher\
          Copy-Item Tools\patcher\src\main.rs out\patcher\src\
          cd out\patcher
          cargo build --release
          Copy-Item target\release\tiktok-region-installer.exe ..\
          Get-ChildItem ..\*.exe | Select-Object Name, Length

      - name: Собрать всё в один архив
        shell: pwsh
        run: |
          Copy-Item LICENSE out\ -ErrorAction SilentlyContinue
          # insert-dylib кладём рядом: обёртка вызывает его сама,
          # пользователю не нужно знать, что он существует.
          Compress-Archive -Path out\* -DestinationPath tiktok-region-installer-windows.zip
          Get-Item tiktok-region-installer-windows.zip | Select-Object Name, Length

      - name: Отдать установщик
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: tiktok-region-installer-windows.zip
          retention-days: 90
          if-no-files-found: error
